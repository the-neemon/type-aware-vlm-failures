# Activation caching schema. Resolves open decision 1 (TASKS.md Section 7).
#
# DECIDED 2 September (open decision 1). Supporting arithmetic is in
# results/storage_budget.md, regenerable via src/extract/storage_budget.py.
# Still contingent on P0.10: the vision-token counts behind the budget are
# analytic and unverified against the real processor. If P0.10 fails, recompute
# before caching anything.
#
# Headline: pooling the vision tokens is what makes this affordable, and once
# they are pooled we can afford EVERY layer rather than a subsampled set. The
# SPEC assumed storage forced us to subsample; the arithmetic says otherwise.

schema_version: 1

dtype: float16            # never float32; doubles the cache for no probe benefit

# --------------------------------------------------------------------------
# What to cache, per layer, per item
# --------------------------------------------------------------------------
# Schema B in results/storage_budget.md. Four vectors per layer.
#
# vision_mean and vision_max cover HALP's visual-only family, which it reports
# as the strongest for Qwen2.5-VL specifically. query_last covers the late
# query-token family that HALP reports as strongest for most other models.
# query_mean is cheap insurance. Caching all four means the representation
# family becomes an analysis choice rather than a caching commitment we cannot
# revisit without a full re-run.
positions:
  - vision_mean          # mean over the image's vision tokens
  - vision_max           # elementwise max over the same
  - query_last           # final query token, the pre-generation state
  - query_mean           # mean over query tokens

# --------------------------------------------------------------------------
# Which layers
# --------------------------------------------------------------------------
# All of them, subject to a quota rule. Liu et al. report the grounding and
# hallucination pathways at different depths (mid-to-late versus early and
# network boundaries), so full depth coverage is exactly what the hypothesis
# needs, and it costs 3.8x on a base of 9 GiB.
#
# RULE (revised 2 Sep, after P0.3 reported the real quota). Stated as a
# fraction rather than a fixed GiB bar, because the first version was pinned to
# a 20k-item planning number that decisions 2 and 3 invalidated the same day:
#
#   cache at planned volume, plus room to re-cache one model,
#   must be <= 70% of durable_root quota   ->  layers: all
#   otherwise                              ->  layers_fallback
#
# Currently: 6,000 planned items -> 10.3 GiB, or 16.2 GiB with the re-cache
# headroom, against a 30 GiB quota. That is 54%, so layers: all holds.
# Recheck this if the item count grows; at 10k items it reaches 90% and the
# contingencies below apply in order.
layers: all

# Used only if the quota rule above selects the fallback. Fixed here so the
# choice is not made ad hoc later, and spans early, middle and late depth.
layers_fallback:
  qwen2_5_vl_7b: [2, 6, 10, 14, 18, 22, 26, 27]     # of 28
  llava_next_mistral_7b: [2, 7, 11, 15, 19, 23, 27, 31]  # of 32

# --------------------------------------------------------------------------
# Compute pool (open decision 9, DECIDED 2 September)
# --------------------------------------------------------------------------
# Everything runs on Ada. The H100 belongs to Sanjith's own research and is not
# available to this project.
#
# The kernel-consistency requirement does not go away with it: a model's
# answers and its activations must come from the same hardware or P4.4's
# coupling breaks silently. Ada's nodes carry mixed GPU types, so "run it on
# Ada" is NOT a pin by itself. Every inference and caching job must name one
# GPU type in its SLURM constraint, that type is fixed for the project, and it
# is recorded next to the library versions in the run config.
compute_pool: ada
gpu_type: 2080ti          # RTX 2080 Ti, sm_75, 11 GiB. Measured 2 Sep, see
                          # results/ada_filesystem.md Section 4. FROZEN.
                          # Turing has no bf16 tensor cores and no FlashAttention-2,
                          # so the project runs fp16 + sdpa. This is part of the
                          # pin: it changes activations, not just speed.
gpu_dtype: float16
gpu_attn_implementation: sdpa

# Pinned by P0.10 on 7 Sep. transformers 4.57 loads Qwen2VLImageProcessorFast by
# default and warns that it "may produce slightly different outputs". It does:
# against the slow processor the preprocessed pixels differ on every ChartQA
# figure tested, worst absolute difference 0.030 (mean 1e-5) on normalised
# values. Vision-token COUNTS are unaffected, so the storage budget is safe,
# but the pixels feeding the encoder are not, and this project measures what
# the encoder does with them. Two of us on different defaults would cache
# different activations from the same figure and neither would notice.
# true is the 4.57 default and the maintained path. FROZEN with gpu_type.
processor_use_fast: true
gpus_per_job: 2           # 16.6 GiB of fp16 weights does not fit 11 GiB of VRAM
slurm_constraint: "--constraint=2080ti --exclude=gnode077"

# --------------------------------------------------------------------------
# Models
# --------------------------------------------------------------------------
models:
  qwen2_5_vl_7b:
    hf_id: Qwen/Qwen2.5-VL-7B-Instruct
    hidden_size: 3584       # verified against configs/model_configs/
    num_hidden_layers: 28
    # Qwen2.5-VL is dynamic-resolution. The shipped default of 12845056 leaves
    # the token count unbounded by figure size (a 1080x1920 figure costs 2691
    # tokens). Capping at 1.0M bounds it near 1260 with no loss on typical
    # ChartQA figures, which resize identically under both caps. This bounds
    # inference compute and keeps sequence lengths comparable across items.
    max_pixels: 1000000
    # MEASURED by P0.10 on 7 Sep against the real Qwen2VLImageProcessor, on 5
    # ChartQA test figures. The analytic reimplementation of smart_resize in
    # src/extract/storage_budget.py matched the processor exactly on all five,
    # so the budget table is sound:
    #   415x322 -> 180 tokens
    #   800x557 -> 580 tokens   (the common ChartQA size, hence the planner)
    #   850x600 -> 630 tokens
    # The old planning number of 1044 came from a hypothetical 800x1000 figure
    # and is pessimistic for real ChartQA. It only ever fed the Schema C
    # (unpooled) estimate, which was rejected anyway; pooled cost per item is
    # vectors x hidden x layers and does not depend on the token count at all.
    typical_vision_tokens: 580
    measured_vision_tokens_range: [180, 630]

  llava_next_mistral_7b:
    hf_id: llava-hf/llava-v1.6-mistral-7b-hf
    # Both fields are ABSENT from the VLM config's text_config and fall back to
    # Mistral-7B-Instruct-v0.2 defaults. Read them from the backbone config.
    hidden_size: 4096
    num_hidden_layers: 32
    vision_tokens: 2928     # fixed-grid anyres, largest pinpoint

# --------------------------------------------------------------------------
# Storage
# --------------------------------------------------------------------------
storage:
  # Ada's /scratch is NODE-LOCAL. A job on one node cannot see what a job on
  # another node wrote there, so it is working space for the duration of a job,
  # never the cache's home. Every job stages its output to durable_root before
  # exiting (TASKS.md P0.9) or the cache fragments across nodes.
  working_root: /scratch    # node-local, fast, per job
  durable_root: $HOME       # measured in P0.3: the ONLY shared, writable,
                            # durable path visible from compute nodes.
                            # scripts/ada_env.sh stages into
                            # $HOME/anlp/project/vlm-failures-durable.
  durable_quota_gib: 30     # per user, hard limit 31 GiB

  # /scratch is bind-mounted to the SAME directory as /tmp (same device and
  # inode), and tmpreaper runs daily over /tmp/. at the 7-day default. The
  # oldest surviving entry observed on a node was 5 days old. So the weights
  # cache on /scratch is never set up once: stage_in_model in
  # scripts/ada_env.sh repairs it on whichever node a job lands on, which is a
  # no-op on a warm node. Measured 2 Sep, results/ada_filesystem.md Section 3.
  working_root_purge_days: 7
  stage_back_required: true

  # /share1 has 100 GiB but is mounted only on the head node, and compute nodes
  # cannot reach it, so no job can write there directly. It is not unusable
  # though: jobs stage to $HOME (visible everywhere) and a login-node step can
  # move completed caches to /share1 afterwards. Worth confirming whether probe
  # training can read /share1 from the login node, since probes are CPU work
  # that takes minutes. Tracked as decision 10.
  cold_archive: /share1
  cold_archive_gib: 100
  cold_archive_reachable_from_compute: false

  # Planned volume after decisions 2 and 3 is ~6,000 items: ~2,800 naturalistic
  # (a 700-error pool plus matched correct items, per model) and ~3,200
  # synthetic. Per item across both models at all layers: 1808 KB.
  planned_items: 6000
  estimated_gib: 10.3
  estimated_gib_with_recache_headroom: 16.2

  # 10.3 GiB is the CACHE alone. The 30 GiB quota covers everything in $HOME,
  # and the cache is one line item among several:
  #
  #     5.0 GiB  python env (torch + transformers)   -> put on /scratch instead
  #     3.0 GiB  ChartQA images and tables
  #     0.5 GiB  synthetic figures (~3200 charts)
  #    10.3 GiB  activation cache, all layers
  #     5.9 GiB  headroom to re-cache one model
  #    -------
  #    24.7 GiB  of 30 GiB, or 82% before anything already in home
  #
  # Workable, not comfortable. Moving the env to /scratch takes it to ~66%.
  # Whoever owns the quota should check actual free space first; 30 GiB is the
  # quota, not what is currently unused.
  #
  # MODEL WEIGHTS DO NOT GO HERE. Qwen2.5-VL-7B is ~16.6 GB and LLaVA-NeXT-7B
  # ~15.1 GB; together 29.5 GiB, which exhausts the quota on its own. HF_HOME
  # stays on node-local /scratch with jobs pinned to a fixed node set, per
  # TASKS.md P0.3.

  # Contingencies IN ORDER if the item count grows past ~8,000. Do not shard the
  # cache across teammates' home directories: home dirs are not group-readable
  # by default, one person's quota filling silently breaks a quarter of the
  # cache, and four roots reintroduces exactly the fragmentation P0.9 exists to
  # prevent. 30 GiB is also total quota, not free space.
  contingencies:
    - drop query_mean from positions (4 -> 3 vectors per layer, saves 25%)
    - cache and analyse one model at a time; they are reported separately
      anyway (TASKS.md Section 5.7), so the asymmetry costs nothing
    - stage completed caches to /share1 from the login node (decision 10)
    - only then, layers_fallback

# --------------------------------------------------------------------------
# Escape hatch
# --------------------------------------------------------------------------
# Unpooled vision tokens are 4.6 TiB across both models at 20k items, even
# restricted to 8 layers. If an experiment genuinely needs per-token
# activations, re-cache a subsample of at most a few hundred items rather than
# changing this schema.
unpooled_subsample_max_items: 500
